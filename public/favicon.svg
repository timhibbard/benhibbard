<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ben Hibbard">
  <title>Ben Hibbard</title>
  <!-- Navy matches the navbar and the theme-color meta tag in index.html. It
       also keeps enough contrast to stay visible on both the light and dark
       Chrome tab strips, which a white background would not. -->
  <rect width="100" height="100" rx="18" fill="#0a2540"/>
  <!-- Barlow Condensed 700 "B", the same face and weight as the navbar
       wordmark, converted from the @fontsource woff2 to a path. A favicon
       cannot load a webfont, so <text font-family="Barlow Condensed"> would
       silently fall back to Arial Narrow on every visitor's machine.
       Transform maps the 1000upm glyph (baseline at y=0, cap top at y=-700)
       onto a 40 x 69.65 ink box centred in the square. -->
  <path fill="#fff" transform="translate(25.622 84.826) scale(.099502)" d="M245 0H56Q51 0 47.5-3.5Q44-7 44-12V-688Q44-693 47.5-696.5Q51-700 56-700H223Q323-700 379.5-652Q436-604 436-509Q436-410 368-365Q364-362 367-359Q446-303 446-193Q446-100 390-50Q334 0 245 0ZM185-574V-417Q185-412 190-412H226Q260-412 279-433.5Q298-455 298-494Q298-535 279.5-557Q261-579 226-579H190Q185-579 185-574ZM305-214Q305-258 286-284Q267-310 235-310H190Q185-310 185-305V-127Q185-122 190-122H234Q267-122 286-146Q305-170 305-214Z"/>
</svg>
