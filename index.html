<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leads with the name, class year and event group, since that is what a
         coach types into a search box. PRs are in the description because they
         are the first thing a coach wants to see. -->
    <title>Ben Hibbard | Class of 2027 Distance Runner — Greenville, SC</title>
    <!-- Kept under ~155 chars so Google shows it without truncating. -->
    <meta
      name="description"
      content="Class of 2027 distance runner at J.L. Mann High School, Greenville SC. PRs 4:21.44 (1600m), 9:40.97 (3200m), 16:29.49 (5K XC). 4.728 GPA, 1290 SAT."
    />
    <link rel="canonical" href="https://benhibbard.com/" />
    <meta name="theme-color" content="#0a2540" />

    <!-- Link previews for when a coach shares the page in email or a text. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://benhibbard.com/" />
    <meta property="og:site_name" content="Ben Hibbard" />
    <meta
      property="og:title"
      content="Ben Hibbard | Class of 2027 Distance Runner — Greenville, SC"
    />
    <meta
      property="og:description"
      content="Distance runner at J.L. Mann High School. PRs: 4:21.44 (1600m), 9:40.97 (3200m), 16:29.49 (5K XC). 4.728 weighted GPA, 1290 SAT."
    />
    <!-- Absolute URL: OG scrapers do not resolve relative paths. Lives in
         public/ so the filename stays stable instead of being content-hashed —
         Facebook, LinkedIn and iMessage all cache previews by image URL. -->
    <meta property="og:image" content="https://benhibbard.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ben Hibbard, class of 2027 distance runner at J.L. Mann High School, with PRs of 4:21.44 for 1600m, 9:40.97 for 3200m and 16:29.49 for the 5K."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://benhibbard.com/og-image.jpg" />
    <meta
      name="twitter:title"
      content="Ben Hibbard | Class of 2027 Distance Runner — Greenville, SC"
    />
    <meta
      name="twitter:description"
      content="Distance runner at J.L. Mann High School. PRs: 4:21.44 (1600m), 9:40.97 (3200m), 16:29.49 (5K XC). 4.728 weighted GPA, 1290 SAT."
    />

    <!-- Google Analytics 4. The measurement ID is public by design — it ships
         in the HTML of every GA-instrumented site — so it lives here rather
         than in a build secret. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TV8QTPZ6E5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-TV8QTPZ6E5');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
